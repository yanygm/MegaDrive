name: Build MegaDrive Core

# Automated build for the Game Bub MegaDrive/Genesis core.
#
# Two jobs:
#   * `elaborate`  (GitHub-hosted, ubuntu-latest): Chisel -> SystemVerilog via
#     mill + CIRCT/firtool. Produces the `megadrive-sv` artifact (.sv + filelist.f).
#   * `synthesize` (SELF-HOSTED runner labelled `vivado`): runs Vivado to turn
#     the elaborated .sv + the MiSTer Nuked-MD netlist (main.v) into the
#     `megadrive-bitstream` artifact (megadrive.bit / megadrive.bit.hs).
#
# The .bit CANNOT be produced on GitHub-hosted runners because Vivado is
# proprietary (x86_64 Linux only, needs a license). Register a self-hosted
# runner with Vivado 2025.1 ML Standard (Artix-7) installed and labelled
# `vivado`; see the `synthesize` job notes below.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  elaborate:
    name: Elaborate Chisel -> SystemVerilog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache mill / coursier
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mill
            ~/.cache/coursier
            fpga/out
          key: mill-${{ hashFiles('fpga/build.mill', 'fpga/framework/package.mill') }}
          restore-keys: |
            mill-

      - name: Elaborate MegaDrive core
        working-directory: fpga
        run: ./mill -i root.runMain platform.handheld.HandheldTop net.gamebub.core.megadrive.HandheldMegadrive 4 --target-dir=build/mega

      - name: Upload SystemVerilog artifact
        uses: actions/upload-artifact@v4
        with:
          name: megadrive-sv
          path: fpga/build/mega
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Full bitstream synthesis (Vivado). Runs ONLY on a SELF-HOSTED runner, because
  # Vivado is proprietary (x86_64 Linux only, needs a license) and cannot run on
  # GitHub-hosted runners.
  #
  # One-time setup:
  #   1. Provision an x86_64 Linux machine with Vivado 2025.1 ML Standard
  #      (includes Artix-7) installed, plus a valid license
  #      (set XILINXD_LICENSE_FILE on the runner).
  #   2. Register it as a GitHub self-hosted runner for this repo:
  #        https://github.com/yanygm/MegaDrive/settings/actions/runners/new
  #      when prompted for labels, add:  vivado
  #      (or edit `runs-on` below to match your runner's label).
  #   3. On that machine, set XILINX_VIVADO (e.g. /opt/Xilinx/Vivado/2025.1).
  #      This workflow reads it from the repo Variable `XILINX_VIVADO`, falling
  #      back to /opt/Xilinx/Vivado/2025.1.
  #
  # Once the labelled runner is online, every push to `main` (or a manual
  # workflow_dispatch) runs this job and uploads megadrive.bit / megadrive.bit.hs.
  # If no such runner exists, the job simply stays queued.
  # ---------------------------------------------------------------------------
  synthesize:
    name: Synthesize bitstream (.bit) — Vivado, self-hosted
    runs-on: [self-hosted, vivado]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Python build deps
        run: python3 -m pip install --user edalize heatshrink2

      - name: Build bitstream
        working-directory: fpga
        env:
          XILINX_VIVADO: ${{ vars.XILINX_VIVADO || '/opt/Xilinx/Vivado/2025.1' }}
        run: |
          python3 scripts/build_core.py \
            --target gamebub_rev4 \
            --name megadrive \
            --core-class net.gamebub.core.megadrive.HandheldMegadrive \
            --build-root build/mega

      - name: Upload bitstream artifact
        uses: actions/upload-artifact@v4
        with:
          name: megadrive-bitstream
          path: fpga/build/mega/megadrive.bit*
          if-no-files-found: error
